<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - ApoiaMe</title>

  <!-- Fonte Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons (inclui logo do Google) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Ícones Lucide (opcional para outros ícones) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CSS custom -->
  <link rel="stylesheet" href="../css/login.css" />
  <link rel="icon" type="image/x-icon" href="../arquivos/favicon.ico" />
</head>
<body>

    <main class="login-split-screen">
        
        <section class="login-panel-imagem">
            <div class="login-panel-imagem-content">
                <img src="../arquivos/ChatGPT Image 30_10_2025, 10_57_56 (1).png" alt="Logo Apoia Me" class="logo-login"> <h1 class="h2 mt-4">Seja bem-vindo(a)!</h1>
                <p class="fs-5 text-light opacity-75">Conectando vizinhos para fortalecer a comunidade.</p>
            </div>
        </section>

        <section class="login-panel-form">
            <div class="form-container">
                <h2 class="h3 mb-4 fw-bold text-center">Faça seu Login</h2>
                
                <form id="form-login" class="needs-validation" novalidate>
                    
                    <div class="mb-3">
                        <label for="login-email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="login-email" required>
                        <div class="invalid-feedback">Por favor, informe um e-mail válido.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="login-senha" class="form-label">Senha</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="login-senha" required>
                            <button type="button" class="btn btn-outline-secondary toggle-senha" data-target="login-senha" aria-label="Mostrar senha">
                                <i class="bi bi-eye"></i>
                            </button>
                            <div class="invalid-feedback w-100">Por favor, informe sua senha.</div>
                        </div>
                    </div>
                    
                    <div class="form-text text-end mb-3">
                        <a href="recuperar.html">Esqueceu a senha?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 btn-lg">Entrar</button>

                    <div class="separador-ou">
                        <span>ou</span>
                    </div>

                    <button type="button" class="btn btn-google w-100">
                        <i class="bi bi-google"></i>
                        Entrar com Google
                    </button>
                    
                    <p class="mt-4 text-center text-muted">
                        Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
                    </p>
                </form>
            </div>
        </section>
        
    </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/login.js"></script>
  <script>lucide.createIcons();</script>    
  <script type="module" src="/firebase-init.js"></script>
  <script type="module" src="/login-auth.js"></script>
</body>
</html>
